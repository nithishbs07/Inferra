name: Extension API

on:
  pull_request:
    paths:
      - "frontend/src/extensions/**"
      - "frontend/scripts/validate-extension-contract.mjs"
      - ".github/workflows/extension-api.yml"

jobs:
  extension-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test -- src/extensions/extensions.test.ts
      - run: node scripts/validate-extension-contract.mjs
      - run: npm run build
